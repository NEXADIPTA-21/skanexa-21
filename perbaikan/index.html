<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemeliharaan Sistem - Website Dalam Perbaikan</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-purple: #581c87;
            --deep-purple: #3b0764;
            --light-purple: #f3e8ff;
            --accent-purple: #9333ea;
            --text-dark: #1f2937;
            --text-muted: #6b7280;
            --bg-color: #faf5ff;
            --card-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background-image: 
                radial-gradient(at 0% 0%, rgba(147, 51, 234, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(88, 28, 135, 0.1) 0px, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 3.5rem 3rem;
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(88, 28, 135, 0.05), 0 8px 10px -6px rgba(88, 28, 135, 0.05);
            border: 1px solid rgba(147, 51, 234, 0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, var(--deep-purple), var(--accent-purple));
        }

        .status-badge {
            display: inline-block;
            background-color: var(--light-purple);
            color: var(--deep-purple);
            font-size: 0.8125rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0.5rem 1.25rem;
            border-radius: 9999px;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            color: var(--deep-purple);
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        p {
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .divider {
            width: 60px;
            height: 3px;
            background-color: var(--light-purple);
            margin: 0 auto 2.5rem auto;
            border-radius: 2px;
        }

        .contact-info {
            font-size: 0.9375rem;
            color: var(--text-dark);
            margin-top: 1rem;
        }

        .contact-info a {
            color: var(--accent-purple);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .contact-info a:hover {
            color: var(--deep-purple);
            text-decoration: underline;
        }

        @media (max-width: 640px) {
            .container {
                padding: 2.5rem 1.5rem;
            }
            
            h1 {
                font-size: 1.875rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status-badge">Pemeliharaan Sistem</div>
        
        <h1>Situs Sedang Diperbarui</h1>
        
        <div class="divider"></div>
        
        <p>Kami sedang melakukan peningkatan infrastruktur dan pembaruan sistem untuk menghadirkan pengalaman yang lebih optimal. Mohon kunjungi kembali dalam beberapa saat.</p>
        
        <div class="contact-info">
            Butuh bantuan mendesak? Hubungi kami melalui <a href="mailto:support@domain.com">support@domain.com</a>
        </div>
    </div>

</body>
</html>
